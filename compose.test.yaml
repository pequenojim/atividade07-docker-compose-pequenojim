services:
  tests:
    build:
      context: .
    command: ["python", "-m", "unittest", "discover", "-s", "tests", "-v"]
    volumes:
      - ./tests:/app/tests:ro
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - rede_pequenojim
    restart: "no"
